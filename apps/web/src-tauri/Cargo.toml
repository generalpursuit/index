[package]
name = "app"
version = "0.1.0"
description = "Index — a home for your links"
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.6"
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1.53", features = ["time"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

keyring = "4.2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[features]
# Opt-in native integration runner; never enabled in distributed builds.
native-smoke = []
