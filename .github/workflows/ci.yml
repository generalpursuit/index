name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile device and simulator apps with Share extension, then run Swift tests
        run: sh apps/ios/Scripts/check-local.sh

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format and lint
        run: |
          bun run oxfmt --check
          bun run oxlint
      - name: Verify generated brand assets
        run: |
          bun assets/brand/sync.ts --target web --check
          bun test assets/brand
      - name: API, server, and deployment tests
        run: |
          bun run --cwd apps/web test
          python3 apps/web/scripts/test-desktop-signing.py
          python3 apps/web/scripts/test-share-profiles.py
          bun run --cwd packages/api test
          bun run --cwd apps/server test
          bun run --cwd packages/infra test
      - name: Build and typecheck
        env:
          VITE_SERVER_URL: http://localhost:3002
        run: |
          bun run check:tooling
          bun run --cwd apps/web check-types
          bun run --cwd packages/ui check-types
          bun run --cwd apps/server check-types
          bun run --cwd packages/infra check-types
      - name: Install Chromium
        working-directory: apps/web
        run: bun run playwright install --with-deps chromium
      - name: Browser tests against the production bundle
        working-directory: apps/web
        env:
          E2E_PRODUCTION: "1"
        # The headless shell reports notification permission as denied despite
        # a browser-context grant. Use the full browser for the real worker tests.
        run: xvfb-run --auto-servernum bun run test:e2e --headed
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
