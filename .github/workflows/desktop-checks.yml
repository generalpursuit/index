name: Desktop native checks

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/src-tauri/**"
      - "apps/web/scripts/**"
      - "apps/ios/**"
      - ".github/workflows/desktop-*.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/web/src-tauri/**"
      - "apps/web/scripts/**"
      - "apps/ios/**"
      - ".github/workflows/desktop-*.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VITE_SERVER_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode with Swift 6
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/web/src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      - run: cargo test --locked --manifest-path apps/web/src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path apps/web/src-tauri/Cargo.toml
      - name: Compile macOS Share extension without release credentials
        if: runner.os == 'macOS'
        run: xcodebuild -project apps/ios/Index.xcodeproj -scheme IndexShareMac -configuration Debug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
