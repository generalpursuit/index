name: Release

# Release only on manual dispatch from main; the input picks the stage.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Release stage
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.release.outputs.stage }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: release
        name: Require main and select the release version; production must exceed the latest tag
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
        run: bun packages/infra/release.ts

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.version.outputs.stage }}
    env:
      DEPLOY_STAGE: ${{ needs.version.outputs.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Deploy API, web, database migrations, and photos
        working-directory: packages/infra
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_REDIRECT_DOMAINS: ${{ vars.WEB_REDIRECT_DOMAINS }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
        run: bun run deploy --stage "$DEPLOY_STAGE" --yes
      - name: Verify the deployed application
        working-directory: packages/infra
        env:
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_REDIRECT_DOMAINS: ${{ vars.WEB_REDIRECT_DOMAINS }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: bun run smoke -- "$DEPLOY_STAGE"

  build:
    needs: [version, checks]
    environment: desktop-${{ needs.version.outputs.stage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage,deb,rpm
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      INDEX_DESKTOP_CHANNEL: ${{ needs.version.outputs.stage }}
      INDEX_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
      INDEX_UPDATE_PLATFORM: ${{ matrix.platform }}
      INDEX_RELEASE_REPOSITORY: ${{ github.repository }}
      INDEX_UPDATER_PUBLIC_KEY: ${{ vars.INDEX_UPDATER_PUBLIC_KEY }}
      INDEX_APPLE_TEAM_ID: ${{ vars.INDEX_APPLE_TEAM_ID }}
      INDEX_APP_ID_PREFIX: ${{ vars.INDEX_APP_ID_PREFIX }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode with Swift 6
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/web/src-tauri -> target
          key: release-${{ needs.version.outputs.stage }}-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev libfuse2 rpm
      - run: bun install --frozen-lockfile
      - name: Require the channel's update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Run the Mac desktop signing setup for both GitHub environments.'; exit 1; }
          test -n "$INDEX_UPDATER_PUBLIC_KEY" || { echo 'Missing INDEX_UPDATER_PUBLIC_KEY.'; exit 1; }
      - name: Install Apple identity, channel profiles, and notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          INDEX_MAC_HOST_PROFILE_BASE64: ${{ secrets.INDEX_MAC_HOST_PROFILE_BASE64 }}
          INDEX_MAC_EXTENSION_PROFILE_BASE64: ${{ secrets.INDEX_MAC_EXTENSION_PROFILE_BASE64 }}
        run: python3 apps/web/scripts/ci-apple-signing.py prepare
      - name: Test native shell
        env:
          VITE_SERVER_URL: ${{ needs.version.outputs.stage == 'production' && 'https://index-production-api.generalpursuit.workers.dev' || 'https://index-staging-api.generalpursuit.workers.dev' }}
        run: cargo test --locked --manifest-path apps/web/src-tauri/Cargo.toml
      - name: Install pinned DMG layout tool
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --require-hashes --only-binary :all: -r apps/web/scripts/desktop/dmgbuild-requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Build signed update artifacts and installers
        working-directory: apps/web
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run desktop:build --channel "$INDEX_DESKTOP_CHANNEL" --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Verify Apple notarization ticket and Gatekeeper acceptance
        if: runner.os == 'macOS'
        env:
          PRODUCT_NAME: ${{ needs.version.outputs.stage == 'production' && 'Index' || 'Index Staging' }}
        run: |
          app="apps/web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/$PRODUCT_NAME.app"
          # Validation asks Apple's ticket service, whose connection from hosted runners sometimes
          # drops (exit 68). Retry that; a missing ticket (any other failure) fails at once.
          for attempt in 1 2 3 4 5; do
            status=0
            xcrun stapler validate "$app" || status=$?
            [ "$status" -eq 0 ] && break
            if [ "$status" -ne 68 ] || [ "$attempt" -eq 5 ]; then exit "$status"; fi
            echo "Apple's ticket service was unreachable; retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done
          spctl --assess --type execute --verbose "$app"
      - name: Collect release files and checksums
        run: bun apps/web/scripts/desktop/artifacts.ts "apps/web/src-tauri/target/${{ matrix.target }}/release/bundle" desktop-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ needs.version.outputs.stage }}-${{ matrix.platform }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS'
        run: python3 apps/web/scripts/ci-apple-signing.py cleanup

  publish:
    # Advance the update feed only once the API that new apps call is live.
    needs: [version, build, deploy]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # Serialize the shared metadata branch while preserving separate channel files.
    concurrency:
      group: desktop-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-${{ needs.version.outputs.stage }}-*
          path: desktop-artifacts
          merge-multiple: true
      - name: Publish the complete release and advance its update feed
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DESKTOP_CHANNEL: ${{ needs.version.outputs.stage }}
          INDEX_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: bun apps/web/scripts/desktop/publish.ts desktop-artifacts

  tag:
    if: needs.version.outputs.stage == 'production'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the completed production release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
